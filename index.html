
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="clock-card">

            <div class="top">
                <span class="status-dot"></span>
                LIVE DIGITAL CLOCK
            </div>

            <p class="greeting">Welcome to your dashboard</p>

            <div id="clock" class="clock">00:00:00</div>

            <div id="period" class="period">AM</div>

            <div class="divider"></div>

            <div id="day" class="day">Monday</div>
            <div id="date" class="date">January 1, 2026</div>

            <div class="buttons">
                <button id="formatBtn">Switch to 24H</button>
                <button id="fullscreenBtn">Full Screen</button>
            </div>

            <div class="footer">
                MADE WITH HTML, CSS & JAVASCRIPT
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
